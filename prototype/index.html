function inventory(product,store){

 const reserved=movements.filter(o=>o.state==='reserved').reduce((n,o)=>n+o.qty,0);

}
function demand(product,store){return product[store+'Sold']/30*policy.factor;}

 const {free}=inventory(product,activeStore);
 const rate=demand(product,activeStore), needed=target(rate), point=Math.ceil(rate*(policy.lead+policy.buffer));

 const transfer=Math.min(deficit,donor), buy=deficit-transfer;

 const state=!rate?'Без продаж':critical?'До поставки закончится':deficit?'Пора пополнить':excess?'Сверх цели':'Достаточно';
 return {product,free,rate,point,needed,buy,transfer,excess,critical,state,deficit};
}

<script>
(() => {
 const cabinet=document.createElement('section');
 cabinet.id='partner-cabinet';
 document.querySelector('main').append(cabinet);
 const columns=['Дата','Заказ','Площадка','Артикул','Количество','К оплате ₽'];
 const aliases=[['Дата','Дата отгрузки'],['Заказ','Номер заказа'],['Площадка','Маркетплейс'],['Артикул','SKU'],['Количество','Кол-во'],['К оплате ₽','К оплате','Сумма к оплате']];
 const reports=[];
 const catalog=new Map(purchasingProducts.map(p=>[p.code,p.name]));
 const sample=[columns,['2026-11-11','OZ-DEMO-101','Ozon','A2S-DEMO-P001',1,250],['2026-11-11','WB-DEMO-202','Wildberries','A2S-DEMO-P002',2,400]];
 let role='partner', draft=null, notice='', loadVersion=0;
 const statuses={review:'На проверке',confirmed:'К оплате',rejected:'Отклонён',paid:'Оплачен'};
 const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
 const norm=value=>String(value??'').trim().toLowerCase();
 const rub=kopecks=>(kopecks/100).toLocaleString('ru-RU',{style:'currency',currency:'RUB'});
 const number=value=>Number(String(value??'').trim().replace(/[\s\u00a0]/g,'').replace(',','.'));
 function dateValue(value){
   if(/^\d{1,5}$/.test(String(value)))value=Number(value);
   if(typeof value==='number'&&Number.isInteger(value)&&value>0&&value<100000)return new Date(Date.UTC(1899,11,30)+value*86400000).toISOString().slice(0,10);
   let iso=String(value??'').trim().replace(/^(\d\d)\.(\d\d)\.(\d{4})$/,'$3-$2-$1');
   if(!/^\d{4}-\d\d-\d\d$/.test(iso))return '';
   const parsed=new Date(iso+'T00:00:00Z');
   return Number.isFinite(+parsed)&&parsed.toISOString().slice(0,10)===iso?iso:'';
 }
 function prepare(matrix,name){
   const result={name,rows:[],errors:[],total:0};
   if(!Array.isArray(matrix)||!Array.isArray(matrix[0])){result.errors.push('В файле нет таблицы.');return result}
   const header=matrix[0].map(norm);
   const indexes=aliases.map(names=>header.reduce((matches,col,i)=>names.some(n=>norm(n)===col)?matches.concat(i):matches,[]));
   indexes.forEach((matches,i)=>{if(matches.length!==1)result.errors.push('Проверьте колонку «'+columns[i]+'».')});
   if(result.errors.length)return result;
   const used=new Set(reports.filter(r=>r.status!=='rejected').flatMap(r=>r.rows.map(x=>x.key)));
   matrix.slice(1).forEach((line,i)=>{
     if(!line.some(value=>String(value??'').trim()))return;
     const [rawDate,rawOrder,rawMarket,rawCode,rawQty,rawAmount]=indexes.map(([index])=>line[index]);
     const date=dateValue(rawDate),order=String(rawOrder??'').trim(),code=String(rawCode??'').trim().toUpperCase();
     const market=({'ozon':'Ozon','озон':'Ozon','wb':'Wildberries','вб':'Wildberries','wildberries':'Wildberries'})[norm(rawMarket)];
     const qty=number(rawQty),amount=number(rawAmount),cents=Math.round(amount*100);
     const key=JSON.stringify(['partner01',market,norm(order),code]);
     const issues=[];
     if(!date)issues.push('дата в формате ДД.ММ.ГГГГ или ГГГГ-ММ-ДД');
     if(!order)issues.push('пропущен номер заказа');
     if(!market)issues.push('неизвестная площадка');

   });
   if(!result.rows.length&&!result.errors.length)result.errors.push('Добавьте хотя бы одну отправку.');

 function rowsHtml(rows){return rows.map(x=>'<div class="entry"><strong>'+escape(x.market)+' · '+escape(x.order)+'</strong><br>'+escape(catalog.get(x.code))+' · '+escape(x.qty)+' шт.<br><small>'+escape(x.date)+' · '+escape(x.code)+' · '+rub(x.cents)+'</small></div>').join('')}

   let controls='';
   if(role==='owner'&&r.status==='review')controls=action('confirm-'+r.id,'Подтвердить',true)+action('reject-'+r.id,'Отклонить');
   if(role==='owner'&&r.status==='confirmed')controls=action('pay-'+r.id,'Отметить оплату');
   return '<article><strong>'+escape(r.name)+'</strong><p>'+statuses[r.status]+' · '+rub(r.total)+'</p><details><summary>Отправки ('+r.rows.length+')</summary>'+rowsHtml(r.rows)+'</details><div class="buttons">'+controls+'</div></article>';
 }
 function draw(){
   const owner=role==='owner';
   const debt=reports.filter(r=>r.status==='confirmed').reduce((n,r)=>n+r.total,0);
   const paid=reports.filter(r=>r.status==='paid').reduce((n,r)=>n+r.total,0);
   let html='<a href="#">‹ К панели демо</a><h1>Склад партнёра</h1><p class="label">Демо-роль · локальная сессия</p><div class="buttons">'+['partner','owner'].map((r,i)=>'<button data-part="'+r+'" aria-pressed="'+(r===role)+'">'+['Партнёр','Владелец'][i]+'</button>').join('')+'</div><small>Партнёр № 1 · остаток неизвестен. Отчёты содержат только отправки. Остатки двух собственных складов сохраняются.</small>';
   if(owner)html+='<h2>Расчёты с партнёром</h2><div class="panel">Долг за подтверждённые отправки<b>'+rub(debt)+'</b><small>Отмечено оплаченным · '+rub(paid)+'</small></div>';
   else{
     html+='<h2>Отчёт об отправках</h2><p>Загрузите Excel за день. В графе «К оплате ₽» укажите сумму партнёру за всю строку.</p><div class="buttons"><label class="upload primary">Выбрать Excel<input aria-label="Выбрать Excel" type="file" accept=".xlsx" id="partner-file"></label>'+action('sample','Показать на примере')+'</div><a href="partner-report-example.xlsx" download="partner-report-example.xlsx">Скачать образец Excel</a>';
     if(draft)html+='<article><strong>'+escape(draft.name)+'</strong><p>Распознано строк: '+draft.rows.length+' · '+rub(draft.total)+'</p>'+rowsHtml(draft.rows)+(draft.errors.length?'<div class="problem">'+draft.errors.map(e=>'<p>'+escape(e)+'</p>').join('')+'</div>':action('submit','Отправить на проверку',true))+'</article>';
   }
   if(notice)html+='<p role="status">'+escape(notice)+'</p>';
   cabinet.innerHTML=html+'<h2>'+(owner?'Полученные отчёты':'Мои отчёты')+'</h2>'+(reports.length?reports.slice().reverse().map(reportHtml).join(''):'<p class="label">Отчётов пока нет.</p>');
 }
 cabinet.addEventListener('click',event=>{
   const button=event.target.closest('[data-part]');if(!button)return;
   const id=button.dataset.part;
   if(id==='owner'||id==='partner'){role=id;notice='';loadVersion++}
   else if(role==='partner'&&id==='sample'){loadVersion++;draft=prepare(sample,'Пример отчёта');notice=''}
   else if(role==='partner'&&id==='submit'&&draft&&!draft.errors.length){reports.push({...draft,id:reports.length+1,status:'review'});draft=null;notice='Отчёт передан владельцу на проверку.'}
   else if(role==='owner'){
     const [op,index]=id.split('-');const r=reports.find(item=>item.id===Number(index));

 cabinet.addEventListener('change',async event=>{
   const file=event.target.files?.[0];if(!file||role!=='partner')return;

   const open=location.hash==='#partner';cabinet.hidden=!open;document.body.classList.toggle('partner-open',open);

<script>
(()=>{
  const dock=document.querySelector('main nav');
  const content=document.querySelector('#screen');
  let scheduled=false;
  function reflect(){
    scheduled=false;
    const bounds=dock.getBoundingClientRect();
    if(!bounds.height)return;
    const center=bounds.top+bounds.height/2;
    let nearest=Infinity, tint='148 185 216', position=25;
    for(const element of content.querySelectorAll('canvas,.panel,.action')){
      const rect=element.getBoundingClientRect();
      const offset=(rect.top+rect.height/2-center)/Math.max(1,rect.height/2+130);
      if(Math.abs(offset)>=nearest||Math.abs(offset)>1)continue;
      nearest=Math.abs(offset);
      tint=element.matches('canvas')?'71 192 151':element.matches('.action')?'213 167 105':'135 165 235';
      position=50+offset*45;
    }
    dock.style.setProperty('--reflection',tint);
    dock.style.setProperty('--gleam',position+'%');
  }
  function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(reflect)}}
  window.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule);
  new MutationObserver(schedule).observe(content,{childList:true});
  schedule();
})();
</script>

#screen .big{color:#182a22;letter-spacing:-.055em;font-weight:590}
#partner-link{font-weight:550}
.purchase-actions button,#screen select{background:#fff;border:1px solid #dce2dd;box-shadow:none;color:#30463a}
#glass-root .dashboard-bar:not(.mode-super-pill),#glass-root .mode-super-pill>div>div:first-child{
  background:rgba(250,252,249,.84);border:1px solid #c8d3cb;border-radius:22px;
  box-shadow:0 3px 12px #152b2010!important;
  backdrop-filter:blur(12px) saturate(110%)!important;-webkit-backdrop-filter:blur(12px) saturate(110%)!important;
}
#glass-root .dashboard-bar .glass-reflection,#glass-root .dashboard-bar .glass-top-highlight{display:none}

  background:#dde8e0!important;border-radius:14px!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;
}

@media(prefers-reduced-transparency:reduce){#glass-root .dashboard-bar:not(.mode-super-pill),#glass-root .mode-super-pill>div>div:first-child{background:#fafcf9;backdrop-filter:none!important}}
:root{--ink:#192638;--teal:#2D8687;--mint:#DDF3EC;--ice:#E7EEFC;--white:#F5F9FA;--page:var(--white);--text:var(--ink);--accent:var(--teal);--soft:var(--mint);--outside:var(--ice);--surface:#fff;--line:color-mix(in srgb,var(--text) 17%,var(--page));--muted:color-mix(in srgb,var(--text) 74%,var(--page));color-scheme:light}
:root[data-theme=dark]{--page:var(--ink);--text:var(--white);--accent:var(--mint);--outside:#101a29;--surface:#233347;--soft:#294746;color-scheme:dark}
body{background:var(--outside);color:var(--text)}main{background:var(--page);color:var(--text)}
main header{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:0 0 14px;border-color:var(--line)}
.brand-logo{grid-column:1/-1;width:240px;max-width:100%;height:auto}.brand-logo.dark-logo,:root[data-theme=dark] .light-logo{display:none}:root[data-theme=dark] .dark-logo{display:block}
header .badge{margin:0;color:var(--muted)}
#brand-toggle,#glass-mode,#screen select,main .purchase-actions button,main .buy-submit,main input,main select,#partner-cabinet button,#partner-cabinet .upload{background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:none;border-radius:10px}
#brand-toggle{font:600 12px system-ui;padding:7px 10px;cursor:pointer}
#screen>.panel,#screen .big,#partner-link,.buy-summary,.buy-note,main .row,main h1,main h2,.buy-field{color:var(--text)}
main small,.dates,.legend,.legend span,#partner-cabinet .label,main .muted{color:var(--muted)}
main .panel,.proc-panel,.choices,.buy-flag,.action{background:var(--soft);color:var(--text)}
#screen>.panel{background:transparent}
.choices button{color:var(--muted)}.choices button.selected,#partner-cabinet button[aria-pressed=true]{background:var(--surface);color:var(--text)}
main .row,#screen>.row,#partner-link,.buy-item,.buy-grid,.scenario-box,#partner-cabinet article{border-color:var(--line)}
#partner-cabinet article{background:var(--surface)}#partner-cabinet a{color:var(--accent)}
#partner-cabinet .primary{background:var(--ink);color:var(--white)}:root[data-theme=dark] #partner-cabinet .primary{background:var(--mint);color:var(--ink)}
#glass-root .dashboard-bar:not(.mode-super-pill),#glass-root .mode-super-pill>div>div:first-child{background:color-mix(in srgb,var(--page) 90%,transparent);border-color:var(--line);color:var(--text)}
#glass-root .dashboard-bar button span,#glass-root .dashboard-bar button svg{color:var(--text)}
#glass-root .dashboard-bar .justify-around>.absolute.z-0{background:var(--soft)!important}
#screen button.action,#procurement button.action{background:var(--soft);color:var(--text)}
#glass-root .dashboard-bar button span{color:var(--text)!important}
#brand-toggle[aria-pressed=true]{background:var(--mint);color:var(--ink)}
button,a,summary{-webkit-tap-highlight-color:transparent}

@font-face{font-family:"Open Sans";src:url("fonts/open-sans.ttf") format("truetype");font-weight:300 800;font-display:swap}
body,main button,main select,#brand-toggle,#glass-mode,#glass-root .dashboard-bar button span{font-family:"Open Sans",system-ui,sans-serif}

.overview-metrics article{padding:14px 12px;min-width:0}
.overview-metrics article:first-child{grid-column:1/-1;border-top:3px solid var(--teal);padding:16px}
.overview-metrics span,.overview-metrics b{display:block}
.overview-metrics span{font-size:13px;color:var(--muted);margin-bottom:6px}
.overview-metrics b{font-size:clamp(17px,4.8vw,22px);line-height:1.3;letter-spacing:-.035em;color:var(--text);font-weight:640}

.overview-chart{padding:14px 12px;margin-bottom:14px}
.overview-chart .head{margin:0 0 14px}.overview-chart h2{margin:0;font-size:17px}
.overview-chart select{font-size:12px}.overview-chart small{font-size:11px}
