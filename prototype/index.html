const choice=(items,selected,action)=>'<div class="choices">'+items.map((x,i)=>'<button class="'+(x===selected?'selected':'')+'" data-action="'+action+'" data-index="'+i+'">'+x+'</button>').join('')+'</div>';
function line(groups,labels){
 const canvas=document.querySelector('#plot');if(!canvas)return;
 const w=canvas.clientWidth,h=130,dpr=devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;
 const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.font='11px system-ui';
 const max=Math.max(1,...groups.flatMap(g=>g.values));const ceiling=max>100?Math.ceil(max/100)*100:Math.ceil(max);
 for(let i=0;i<3;i++){let y=12+45*i;ctx.fillStyle='#50695f';ctx.fillText((ceiling*(1-i/2)).toLocaleString('ru-RU',{maximumFractionDigits:1}),0,y+4);ctx.strokeStyle='#d4dfd6';ctx.beginPath();ctx.moveTo(44,y);ctx.lineTo(w-4,y);ctx.stroke()}
 for(const g of groups){ctx.beginPath();g.values.forEach((v,i)=>{const x=46+i*(w-54)/Math.max(g.values.length-1,1),y=102-v/ceiling*90;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=g.color;ctx.lineWidth=2.5;ctx.stroke()}
 ctx.fillStyle='#50695f';ctx.fillText(labels[0],44,125);ctx.textAlign='right';ctx.fillText(labels.at(-1),w-4,125)
}
let graph=null;
function render(){
 graph=null;let html='<h1>'+sections[current]+'</h1>';
 const api='<small>МойСклад · снимок учебного аккаунта</small>',demo='<small>Демонстрационные данные · пример за 6 месяцев</small>';
 const groups=data.flow.reduce((a,x)=>{const k=x[0].slice(0,7);a[k]??=[0,0];a[k][0]+=x[1];a[k][1]+=x[2];return a},{});
 if(current===0){let bal=0;html+=api+panel('Капитал магазина',money(stock+data.cash))+row('В товаре',money(stock))+row('В кассе',money(data.cash))+'<div class="head"><h2>Деньги в кассе</h2><select id="period" aria-label="Период графика">'+[30,90,180].map(x=>'<option '+(x===days?'selected':'')+'>'+x+'</option>').join('')+'</select></div><canvas id="plot" aria-label="Динамика остатка денег"></canvas><small>Млн ₽ на конец дня</small><button data-action="idle" class="action">'+money(idleSum)+' в товарах без продаж　›</button>';const v=data.flow.map(x=>(bal+=x[1]-x[2])/1e6).slice(-days);graph=[[{values:v,color:'#347459'}],[data.flow.at(-days)[0],'10 ноя']]}
 if(current===1){html+=api+panel('Запас по себестоимости',money(stock))+choice(['Все товары','Без продаж'],slow?'Без продаж':'Все товары','stock')+(slow?idle:data.stock).map(r=>row(r.name+'<br><small>'+r.qty+' шт. в наличии</small>',money(r.sum))).join('')}
 if(current===2){html+=api+'<p class="dates">15 мая — 10 ноября 2026</p>'+choice(['ДДС','Прибыли и убытки'],finance,'finance');
 if(finance==='ДДС'){html+=panel('Конечный остаток денег',money(data.cash))+row('Поступило',money(income))+row('Выплачено',money(outgo))+chartBox('Движение денег','Млн ₽ по месяцам периода')+'<p class="legend">━ Поступления　<span>━ Выплаты</span></p>';graph=[[{values:Object.values(groups).map(x=>x[0]/1e6),color:'#347459'},{values:Object.values(groups).map(x=>x[1]/1e6),color:'#907650'}],['Май','Ноябрь']]}
 else{html+=panel('Прибыль за период',money(net))+row('Выручка',money(data.sales))+row('Себестоимость продаж',money(data.cogs))+row('Валовая прибыль',money(gross))+row('Прочие расходы и налоги',money(data.opex))+row('Доходность на 10 млн ₽',(net/1e7*100).toFixed(2).replace('.',',')+'%')}}
 if(current===3){const values=Array.from({length:6},(_,i)=>scenario.Ozon.spend[i]+scenario.Wildberries.spend[i]);const total=values.reduce((a,b)=>a+b)*1000;const clicks=[...scenario.Ozon.clicks,...scenario.Wildberries.clicks].reduce((a,b)=>a+b);html+=demo+panel('Расходы на продвижение',money(total))+row('Переходы',clicks.toLocaleString('ru-RU'))+row('Стоимость перехода',money(total/clicks))+chartBox('Расходы на рекламу','Тысячи рублей за месяц');graph=[[{values,color:'#347459'}],['Июнь','Ноябрь']]}
 if(current===4){let m=scenario[platform],sum=m.orders.reduce((a,b)=>a+b);html+=demo+choice(Object.keys(scenario),platform,'platform')+panel('Заказы · '+platform,sum.toLocaleString('ru-RU'))+row('Расходы на рекламу',money(m.spend.reduce((a,b)=>a+b)*1000))+chartBox('Заказы по месяцам','Количество заказов');graph=[[{values:m.orders,color:'#347459'}],['Июнь','Ноябрь']]}
 if ([0,1,4].includes(current)) {
   const shortcut='<div class="purchase-actions"><button data-action="purchase">План закупок</button><button data-action="simulate">Заказ с площадки</button></div>';
   html=html.replace('</h1>','</h1>'+shortcut);
 }
 screen.innerHTML=html;document.querySelector('header .badge').textContent=current<3?'Учебный аккаунт':'Демо площадок';
 document.querySelector('nav').innerHTML=sections.map((s,i)=>'<button data-action="nav" data-index="'+i+'" class="'+(i===current?'on':'')+'">'+s+'</button>').join('');
 if(graph)line(...graph)
}
let days=180;
const warehouseNames={main:'Основной',secondary:'Второй'};
const policy={lead:18,buffer:4,review:7,factor:1};
let activeStore='main', showFilter='Все', selectedSku=1, selectedMarket='Ozon', orderQty=1;
let orders=[], nextOrder=1, notice='';
const decimal=value=>value.toLocaleString('ru-RU',{maximumFractionDigits:1});
function inventory(product,store){
 const movements=orders.filter(o=>o.code===product.code && o.store===store);
 const shipped=movements.filter(o=>o.state==='shipped').reduce((n,o)=>n+o.qty,0);
 const reserved=movements.filter(o=>o.state==='reserved').reduce((n,o)=>n+o.qty,0);
 const physical=product[store]-shipped;
 return {physical,reserved,free:physical-reserved};
}
function demand(product,store){return product[store+'Sold']/30*policy.factor;}
function target(rate){return Math.ceil(rate*(policy.lead+policy.buffer+policy.review));}
function plan(product){
 const other=activeStore==='main'?'secondary':'main';
 const {free}=inventory(product,activeStore);
 const rate=demand(product,activeStore), needed=target(rate), point=Math.ceil(rate*(policy.lead+policy.buffer));
 const deficit=rate>0 && free<=point ? Math.max(0,needed-free) : 0;
 const donor=Math.max(0,inventory(product,other).free-target(demand(product,other)));
 const transfer=Math.min(deficit,donor), buy=deficit-transfer;
 const excess=Math.max(0,free-needed);
 const critical=rate>0 && free<Math.ceil(rate*policy.lead);
 const state=!rate?'Без продаж':critical?'До поставки закончится':deficit?'Пора пополнить':excess?'Сверх цели':'Достаточно';
 return {product,free,rate,point,needed,buy,transfer,excess,critical,state,deficit};
}
const settings=[
 ['lead','Срок поставки',1,60,1,'дн.'],['buffer','Страховой запас',0,30,1,'дн.'],
 ['review','Интервал закупок',1,30,1,'дн.'],['factor','Сценарий спроса',0.5,2,0.1,'×']
];
function renderPlan(){
 const rows=purchasingProducts.map(plan).sort((a,b)=>Number(b.critical)-Number(a.critical)||b.deficit-a.deficit||b.excess*b.product.cost-a.excess*a.product.cost);
 const amount=rows.reduce((n,r)=>n+r.buy*r.product.cost,0);
 const internal=rows.reduce((n,r)=>n+r.transfer,0);
 const excessValue=rows.reduce((total,r)=>total+r.excess*r.product.cost,0);
 const hits=rows.filter(r=>showFilter==='Все'||(showFilter==='Пополнить'?r.deficit>0:showFilter==='Без продаж'?r.rate===0:r.excess>0));
 document.getElementById('buy-result').innerHTML='<div class="proc-panel">Закупка после перемещений<b>'+money(amount)+'</b><small>Перенести с другого склада: '+internal+' шт.</small></div>'+
 '<p class="buy-summary">Риск до поставки: '+rows.filter(r=>r.critical).length+' поз. · К пополнению: '+rows.filter(r=>r.deficit).length+' поз.</p><p class="buy-summary">Стоимость запаса сверх цели на складе: <b>'+money(excessValue)+'</b></p>'+
 '<label class="buy-field">Отбор<select id="buy-filter">'+['Все','Пополнить','Сверх цели','Без продаж'].map(x=>'<option '+(x===showFilter?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+
 (hits.map(r=>'<details class="buy-item"><summary><b>'+r.product.name+'</b><span class="buy-flag '+(r.critical?'alert':r.deficit?'warn':'')+'">'+r.state+'</span>　'+r.free+' шт. свободно<small>'+ (r.deficit?'Перенести '+r.transfer+' шт. · Заказать '+r.buy+' шт. ('+money(r.buy*r.product.cost)+')':'Сверх цели '+r.excess+' шт. ('+money(r.excess*r.product.cost)+')')+'</small></summary>'+
 '<p class="buy-note">Продано за 30 дней: '+r.product[activeStore+'Sold']+' шт. Спрос по сценарию: '+decimal(r.rate)+' шт./день. Покрытие: '+(r.rate?decimal(r.free/r.rate)+' дн.':'нет оценки')+'. Порог пополнения: '+r.point+' шт. Цель: '+r.needed+' шт.</p></details>').join('')||'<p>Нет позиций по этому фильтру.</p>');
}
function renderSimulator(){
 const product=purchasingProducts[selectedSku], state=inventory(product,activeStore);
 const el=document.getElementById('order-lab');
 el.innerHTML='<h2>Заказ с площадки</h2><p class="buy-note">Локальный сценарий FBS. Обе площадки используют общий свободный остаток выбранного склада. Изменения видны в плане закупок до перезагрузки.</p>'+
 '<label class="buy-field">Товар<select id="sku">'+purchasingProducts.map((p,i)=>'<option value="'+i+'" '+(i===selectedSku?'selected':'')+'>'+p.name+'</option>').join('')+'</select></label>'+
 '<div class="purchase-actions">'+['Ozon','Wildberries'].map(x=>'<button data-market="'+x+'" aria-pressed="'+(x===selectedMarket)+'">'+x+'</button>').join('')+'</div>'+
 '<div class="buy-grid">'+[['На складе',state.physical],['В резерве',state.reserved],['Свободно',state.free]].map(([label,n])=>'<div><small>'+label+'</small><strong>'+n+' шт.</strong></div>').join('')+'</div>'+
 '<form id="place-order"><label class="buy-field">Количество, шт.<input id="buy-qty" type="number" min="1" step="1" required value="'+orderQty+'"></label><button class="buy-submit">Зарезервировать</button></form>'+
 '<p role="status" class="buy-note">'+notice+'</p>'+
 orders.slice().reverse().map(o=>'<div class="buy-item"><b>'+o.market+' №'+o.id+' · '+o.qty+' шт.</b><br><small>'+warehouseNames[o.store]+' · '+purchasingProducts.find(p=>p.code===o.code).name+'</small><div>'+({reserved:'В резерве',shipped:'Отгружен',cancelled:'Отменён'})[o.state]+'</div>'+ (o.state==='reserved'?'<div class="purchase-actions"><button data-order="'+o.id+'" data-event="shipped">Отгрузить</button><button data-order="'+o.id+'" data-event="cancelled">Отменить</button></div>':'')+'</div>').join('')+
 (orders.length?'<div class="purchase-actions"><button id="reset-sim">Сбросить сценарий</button></div>':'');
}
function openPurchasing(focusLab=false){
 graph=null;
 document.querySelector('header .badge').textContent='Учебная модель';
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
 screen.innerHTML='<div id="procurement"><h1>Закупки</h1><small>Остатки на 10 ноября · продажи с 12 октября по 10 ноября 2026</small><div class="purchase-actions">'+
 Object.keys(warehouseNames).map(key=>'<button data-store="'+key+'" aria-pressed="'+(key===activeStore)+'">'+warehouseNames[key]+' склад</button>').join('')+
 '</div><button class="action" id="jump-sim">Смоделировать заказ FBS　›</button><details><summary>Параметры закупки</summary>'+
 settings.map(([key,label,min,max,step,unit])=>'<label class="buy-field">'+label+' <output id="out-'+key+'">'+decimal(policy[key])+'</output> '+unit+'<input data-policy="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+policy[key]+'"></label>').join('')+
 '<p class="buy-note">Спрос — средние продажи выбранного склада за 30 дней × коэффициент. При достижении порога покрываем срок поставки, страховой запас и интервал закупок. Сначала используем излишек другого склада. В пути принято 0.</p><p class="buy-note">В учебной истории 180 дней. Коэффициент задаётся вручную. Для годовой сезонности понадобятся сопоставимые недели нескольких лет, наличие товара, акции и изменения цены.</p></details><div id="buy-result"></div><section class="scenario-box" id="order-lab"></section></div>';
 renderPlan();renderSimulator();
 if(focusLab) document.getElementById('order-lab').scrollIntoView();else window.scrollTo(0,0);
}
document.addEventListener('input',e=>{
 if(e.target.id==='buy-qty')orderQty=Number(e.target.value);
 const key=e.target.dataset.policy;
 if(!key)return;
 policy[key]=Number(e.target.value);document.getElementById('out-'+key).textContent=decimal(policy[key]);renderPlan();
});
document.addEventListener('change',e=>{
 if(e.target.id==='buy-filter'){showFilter=e.target.value;renderPlan()}
 if(e.target.id==='sku'){selectedSku=Number(e.target.value);notice='';renderSimulator()}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='place-order')return;e.preventDefault();
 const p=purchasingProducts[selectedSku],free=inventory(p,activeStore).free;
 if(!Number.isInteger(orderQty)||orderQty<1||orderQty>free){notice='Недостаточно свободного товара или неверное количество.'}
 else{orders.push({id:nextOrder++,code:p.code,store:activeStore,market:selectedMarket,qty:orderQty,state:'reserved'});notice='Резерв создан. Физический остаток изменится при отгрузке.'}
 renderPlan();renderSimulator();
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.store){activeStore=b.dataset.store;notice='';openPurchasing()}
 if(b.dataset.market){selectedMarket=b.dataset.market;notice='';renderSimulator()}
 if(b.id==='jump-sim')document.getElementById('order-lab').scrollIntoView();
 if(b.dataset.order){const order=orders.find(o=>o.id===Number(b.dataset.order));if(!order||order.state!=='reserved')return;order.state=b.dataset.event;notice=order.state==='shipped'?'Товар списан, резерв закрыт.':'Резерв снят, товар снова доступен.';renderPlan();renderSimulator()}
 if(b.id==='reset-sim'){orders=[];nextOrder=1;orderQty=1;notice='Восстановлен исходный снимок.';renderPlan();renderSimulator()}
});

document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b)return;const i=Number(b.dataset.index);switch(b.dataset.action){case 'purchase': openPurchasing(false);return;case 'simulate':openPurchasing(true);return;case 'nav':current=i;break;case 'idle':current=1;slow=true;break;case 'stock':slow=Boolean(i);break;case 'finance':finance=['ДДС','Прибыли и убытки'][i];break;case 'platform':platform=Object.keys(scenario)[i];break}render();window.scrollTo(0,0)});
document.addEventListener('change',e=>{if(e.target.id==='period'){days=Number(e.target.value);render()}});
window.addEventListener('resize',()=>{if(graph)line(...graph)});render();if(location.hash==='#purchases')openPurchasing();
</script></html>
